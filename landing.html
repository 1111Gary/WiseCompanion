<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>把零散的优惠集中起来</title>
    
    <meta property="og:title" content="把零散的优惠集中起来">
    <meta property="og:description" content="每天整理好，点一下就能用">
    <meta property="og:image" content="/assets/icon_apple.png">

    <style>
        :root {
            --bg-color: #0a0e14;
            --text-main: #ffffff;
            --text-sub: #8899a6;
            --accent: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        /* 主标题 */
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        /* 副说明 */
        .subtitle {
            font-size: 15px;
            color: var(--text-sub);
            margin-bottom: 40px;
        }

        /* 引导区域 */
        .guide-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .step {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 16px;
            text-align: left;
        }

        .step-num {
            background: var(--accent);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .highlight {
            color: var(--accent);
            font-weight: bold;
        }

        /* 主按钮 */
        .btn-main {
            margin-top: 10px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
        }

        /* 桌面说明 */
        .pwa-hint {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-sub);
        }

        /* 底部安心说明 */
        .footer-note {
            position: absolute;
            bottom: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        /* 蒙层逻辑 */
        #mask {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
        }

        .mask-content {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            color: white;
        }

        .arrow {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>

    <h1>把零散的优惠集中起来</h1>
    <p class="subtitle">每天有人把能用的都整理好了</p>

    <div class="guide-box">
        <div class="step">
            <span class="step-num">1</span>
            <span>点击右上角 <span class="highlight">「⋯」</span></span>
        </div>
        <div class="step">
            <span class="step-num">2</span>
            <span>选择 <span class="highlight">「用手机打开」</span></span>
        </div>
        <button class="btn-main" onclick="showMask()">继续使用</button>
    </div>

    <p class="pwa-hint">放到桌面，下次点一下就能用</p>

    <div class="footer-note">这是手机自带的打开方式，不是广告链接</div>

    <div id="mask" onclick="this.style.display='none'">
        <div class="mask-content">
            <span class="arrow">↗</span>
            <p>请点击右上角菜单</p>
            <p style="margin-top: 8px;">选择 <span class="highlight">「用手机打开」</span></p>
        </div>
    </div>

    <script>
        (function() {
            const ua = navigator.userAgent.toLowerCase();
            const isWeChat = ua.indexOf('micromessenger') !== -1;

            if (!isWeChat) {
                // 如果不是微信，直接去主页
                window.location.replace('/index.html');
            }
        })();

        function showMask() {
            document.getElementById('mask').style.display = 'block';
        }
    </script>
</body>
</html>
