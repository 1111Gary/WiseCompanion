<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>奈斯</title>
    <!-- Meta Info -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="奈斯 · 判断助手">
    <meta property="og:description" content="帮你少做几次后来会后悔的决定">
    <meta property="og:image" content="https://nex-ai.top/assets/icon_apple.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./assets/icon_apple.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="./manifest.json">

    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./css/components/dashboard.css">
    <link rel="stylesheet" href="./css/components/landing.css">
    <link rel="stylesheet" href="./css/components/pwa-guide.css">
    <link rel="stylesheet" href="./css/components/membership.css">
    <link rel="stylesheet" href="./css/components/pro-plus.css">
    <link rel="stylesheet" href="./css/components/toast.css">
    <link rel="stylesheet" href="./css/components/score-card.css">

    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
</head>
<body>
    <!-- 隐藏资源预加载 -->
    <div style="display:none;"><img src="./assets/icon_apple.png" alt="logo"></div>
    <!-- 1. 开屏引导 (Landing) -->
    <div id="landing-overlay" class="modal-overlay">
        <div class="landing-content">
            <img src="./assets/icon_apple.png" class="brand-logo"
                onerror="this.src='https://placehold.co/80x80/18181b/ffffff?text=N'">
            <h2 class="landing-title">奈斯 · 判断助手</h2>
            <p class="landing-subtitle">🧠不是教你怎么做，先帮你判断值不值得</p>
            <p class="landing-quote">多数后悔，都发生在“当时觉得没问题”的决定之后</p>
            <div class="feat-list">
                <div class="feat-item">
                    <div class="feat-icon"><i class="fas fa-shield-alt"></i></div>
                    <div class="feat-text">
                        <h4>少走弯路</h4>
                        <p>已帮你过滤掉一批“算下来不划算”的选项</p>
                    </div>
                </div>
                <div class="feat-item">
                    <div class="feat-icon"><i class="fas fa-layer-group"></i></div>
                    <div class="feat-text">
                        <h4>不靠记性</h4>
                        <p>重要判断与进度，会替你留着</p>
                    </div>
                </div>
            </div>
            <button class="landing-btn" id="landing-enter-btn">进入判断界面</button>
            <div class="pwa-hint">
                <i class="fas fa-download"></i> 建议添加到主屏幕使用
            </div>
        </div>
    </div>

    <!-- 2. 顶部品牌区 -->
    <div class="brand-area">
        <div class="brand-logo-wrapper">
            <img src="./assets/icon_apple.png" class="brand-logo"
                onerror="this.src='https://placehold.co/56x56/000000/ffffff?text=N'">
        </div>
        <div class="agent-greeting" id="greeting-text">Nex Agent</div>

        <!-- NEW: 全局 Pro Plus 入口按钮 -->
        <button class="pp-global-entry" id="pro-plus-btn">
            🚀 <span>执行指挥</span>
        </button>

        <div class="agent-msg" id="agent-msg"></div>
        <div id="night-hint" class="night-hint" style="display:none;">
            这个时间点，最容易做出后来会后悔的决定。
        </div>
        <div class="agent-date-pill">
            <i class="far fa-clock"></i>
            <span id="date-text">LOADING...</span>
            <button id="pwa-install-btn"><i class="fas fa-plus"></i> 安装</button>
        </div>
    </div>

    <div id="score-card-wrapper"></div>

    <!-- 3. 任务列表区 -->
    <div id="ongoing-section" style="display: none;">
        <div class="section-label"><i class="fas fa-play"></i> 当前处理中</div>
        <div id="ongoing-container"></div>
    </div>

    <div id="recommend-section">
        <div class="section-label"><i class="fas fa-layer-group"></i> 当前事项</div>
        <div id="recommend-list">
            <div class="p-10 text-center text-gray-600" style="font-size: 0.9rem;">
                <i class="fas fa-circle-notch fa-spin"></i> 系统初始化中...
            </div>
        </div>
    </div>

    <div id="video-section" class="video-day">
        <div class="section-label" onclick="toggleVideoSection()">
            <i class="fas fa-video"></i> 相关内容
            <span id="video-toggle-icon">▼</span>
        </div>

        <div id="video-list"></div>

        <div id="night-whisper" class="night-tip"></div>
    </div>
    <!-- 4. 全局 Toast -->
    <div id="toast-box"></div>
    <!-- Guide Modal -->
    <div id="guide-modal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <div id="modal-title" class="modal-title">任务标题</div>
                <div class="trust-hint">
                    <i class="fas fa-shield-check" style="color: var(--color-success)"></i>
                    <span>专业版指引模式已开启</span>
                </div>
            </div>

            <div id="step-list-container" class="modal-scroll-area step-list">
                <!-- JS Generated Content -->
            </div>

            <button onclick="TaskController.closeGuide()" class="modal-close-btn">
                关闭面板
            </button>
        </div>
    </div>
    <div id="membership-root"></div>
    <div id="pwa-guide-root"></div>
    <div id="pro-plus-modal-root"></div> 
    <script type="module" src="./modules/app/main.js"></script>
    <div id="install-guide-modal" class="modal-overlay" style="display:none;">
    </div>
</body>
</html>
